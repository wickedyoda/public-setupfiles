paths-ignore:
  # Ignore example/test files that may contain placeholder secrets
  - "**/sample.*"
  - "**/example.*"
  - "test/fixtures/**"
  # Ignore documentation/wiki content (not code)
  - "docs/**"
  - ".github/wiki/**"
  # Ignore env files with placeholder values only (actual secrets should never be committed)
  - "**/gluetun.env.example"
  - "**/docker-compose.*.env.example"
