name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly on schedule for ongoing monitoring
  schedule:
    - cron: '0 6 * * 1' # Mondays at 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  trufflehog:
    name: Trufflehog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for thorough scanning
          fetch-depth: 0

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          # Scan the full repository path
          path: ./
          # Output results in SARIF format for GitHub code scanning
          extra_args: --format=sarif --output=results.sarif

      - name: Upload Trufflehog results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          checkout_path: ./
