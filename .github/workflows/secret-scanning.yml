name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly on schedule for ongoing monitoring
  schedule:
    - cron: '0 6 * * 1' # Mondays at 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  trufflehog:
    name: Trufflehog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for thorough scanning
          fetch-depth: 0

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          # Scan the full repository path (fetched with full history)
          path: ./
          # Output SARIF results (format inferred from .sarif extension)
          extra_args: --output=results.sarif
        # Non-blocking during initial rollout — the action hardcodes --fail,
        # so secrets found will cause non-zero exit. Remove this once issues are resolved.
        continue-on-error: true

      - name: Upload Trufflehog results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          checkout_path: .
