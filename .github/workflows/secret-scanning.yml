name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly on schedule for ongoing monitoring
  schedule:
    - cron: ['0 6 * * 1'] # Mondays at 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  trufflehog:
    name: Trufflehog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for thorough scanning
          fetch-depth: 0

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan the full repository path
          path: ./
          # Output results in SARIF format for GitHub code scanning
          format: sarif
          output: results.sarif
          # Fail the workflow if secrets are found
          # Non-blocking during initial rollout phase — set to true to make it gating
          fail: false
          # Use entropy-based detection in addition to regex patterns
          only-failed: false

      - name: Upload Trufflehog results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-security-sarif@v3
        with:
          sarif_file: results.sarif
          # Don't fail the build on upload issues (scanning might have passed)
          checkout_path: ./
