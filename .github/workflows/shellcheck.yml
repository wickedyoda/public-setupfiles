name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on all shell scripts
        # Non-blocking during initial rollout phase — set to false to make it gating
        continue-on-error: true
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          # Only fail on error-level issues (not warnings, info, or style)
          severity: error
          # Exclude directories we don't want to lint
          ignore_paths: |
            .git
            .idea
            .vscode
