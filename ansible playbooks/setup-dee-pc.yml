- name: Setup dee-pc
  hosts: dee-pc
  gather_facts: yes
  vars:
    telegraf_version: "1.39.2"
    telegraf_zip_url: "https://dl.influxdata.com/telegraf/releases/telegraf-{{ telegraf_version }}_windows_amd64.zip"
    telegraf_zip_dest: "C:/Temp/telegraf-{{ telegraf_version }}_windows_amd64.zip"
    telegraf_extract_dir: "C:/Temp/telegraf"
    telegraf_extracted_subdir: "{{ telegraf_extract_dir }}/telegraf-{{ telegraf_version }}"
    telegraf_install_dir: "C:/Program Files/Telegraf"
    telegraf_exe_install: "{{ telegraf_install_dir }}/telegraf.exe"
    telegraf_conf_dest: "{{ telegraf_install_dir }}/telegraf.conf"
    ps_version: "7.6.4"
    ps_url: "https://github.com/PowerShell/PowerShell/releases/download/v{{ ps_version }}/PowerShell-{{ ps_version }}-win-x64.msi"
    ps_msi_dest: "C:/Temp/PowerShell-{{ ps_version }}-win-x64.msi"
    influxdb_url: "http://docker2.tail99133.ts.net:8086"
    influxdb_org: "homelab"
    influxdb_bucket: "telegraf"
    influxdb_token: "{{ lookup('env', 'INFLUXDB_TOKEN') }}"

  tasks:
    - name: Verify WinRM connectivity
      win_ping:

    - name: Ensure Temp directory exists
      win_file:
        path: C:/Temp
        state: directory

    - name: Ensure Telegraf install directory exists
      win_file:
        path: "{{ telegraf_install_dir }}"
        state: directory

    - name: Download Telegraf zip
      win_get_url:
        url: "{{ telegraf_zip_url }}"
        dest: "{{ telegraf_zip_dest }}"

    - name: Extract Telegraf zip to Temp
      win_unzip:
        src: "{{ telegraf_zip_dest }}"
        dest: "{{ telegraf_extract_dir }}"
        creates: "{{ telegraf_extracted_subdir }}/telegraf.exe"

    - name: Move Telegraf files into install dir
      win_copy:
        src: "{{ telegraf_extracted_subdir }}/"
        dest: "{{ telegraf_install_dir }}/"
        remote_src: yes

    - name: Install Telegraf Windows service
      win_shell: '"{{ telegraf_exe_install }}" service install'
      args:
        executable: cmd
      register: telegraf_service_install
      ignore_errors: true

    - name: Download PowerShell MSI
      win_get_url:
        url: "{{ ps_url }}"
        dest: "{{ ps_msi_dest }}"
      register: ps_download

    - name: Unblock downloaded PowerShell installer
      win_shell: Unblock-File -Path "{{ ps_msi_dest }}"
      args:
        executable: powershell
      register: ps_unblock
      ignore_errors: true

    - name: Install PowerShell silently via scheduled task
      win_shell: |
        $msiPath = "{{ ps_msi_dest }}"
        $action = New-ScheduledTaskAction -Execute "msiexec.exe" -Argument "/i `"$msiPath`" /qn /norestart ADD_EXPLORER_CONTEXT_MENU_OPENPOWERSHELLPROMPT=1 ADD_PATH=1"
        $trigger = New-ScheduledTaskTrigger -At (Get-Date) -Once
        $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
        Register-ScheduledTask -TaskName "InstallPS7" -Action $action -Trigger $trigger -Settings $settings -Description "Install PowerShell 7" -User "SYSTEM" -RunLevel Highest
        Start-ScheduledTask -TaskName "InstallPS7"
        $task = Get-ScheduledTask -TaskName "InstallPS7"
        while ($task.State -ne "Ready" -and $task.State -ne "Failed") {
          Start-Sleep -Seconds 5
          $task = Get-ScheduledTask -TaskName "InstallPS7"
        }
        $exitCode = (Get-ScheduledTaskInfo -TaskName "InstallPS7").LastTaskResult
        Unregister-ScheduledTask -TaskName "InstallPS7" -Confirm:$false
        exit $exitCode
      args:
        executable: powershell
      register: ps_install
      ignore_errors: true

    - name: Enable auto-restart after power loss
      win_shell: |
        $regPath = "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Power"
        if (-not (Test-Path $regPath)) {
          New-Item -Path $regPath -Force | Out-Null
        }
        Set-ItemProperty -Path $regPath -Name "HiberbootEnabled" -Value 0 -Type DWord -Force
        Set-ItemProperty -Path "HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Reliability" -Name "ShutdownReasonOn" -Value 0 -Type DWord -Force
      args:
        executable: powershell
      register: power_recovery
      ignore_errors: true

    - name: Write telegraf.conf
      win_copy:
        dest: "{{ telegraf_conf_dest }}"
        content: |
          # Telegraf Windows 11 config generated by Ansible
          [agent]
            interval = "10s"
            round_interval = true
            metric_batch_size = 1000
            metric_buffer_limit = 10000
            collection_jitter = "0s"
            flush_interval = "10s"
            flush_jitter = "0s"
            hostname = "{{ ansible_hostname }}"
            omit_hostname = false

          [global_tags]
            host = "{{ ansible_hostname }}"
            os = "windows"

          [[outputs.influxdb_v2]]
            urls = ["{{ influxdb_url }}"]
            token = "{{ influxdb_token }}"
            organization = "{{ influxdb_org }}"
            bucket = "{{ influxdb_bucket }}"
            timeout = "5s"

          [[inputs.win_perf_counters]]
            [[inputs.win_perf_counters.object]]
              ObjectName = "Processor"
              Instances = ["*"]
              Counters = ["% Processor Time"]
              Measurement = "win_cpu"
              IncludeTotal = true

            [[inputs.win_perf_counters.object]]
              ObjectName = "Memory"
              Instances = ["*"]
              Counters = [
                "Available Bytes",
                "Cache Bytes",
                "Committed Bytes",
                "Pool Nonpaged Bytes",
                "Pool Paged Bytes",
                "% Committed Bytes In Use"
              ]
              Measurement = "win_mem"

            [[inputs.win_perf_counters.object]]
              ObjectName = "LogicalDisk"
              Instances = ["*"]
              Counters = ["% Free Space", "Free Megabytes", "% Disk Time", "Current Disk Queue Length"]
              Measurement = "win_disk"

            [[inputs.win_perf_counters.object]]
              ObjectName = "Network Interface"
              Instances = ["*"]
              Counters = ["Bytes Received/sec", "Bytes Sent/sec", "Packets Received/sec", "Packets Sent/sec"]
              Measurement = "win_net"

            [[inputs.win_perf_counters.object]]
              ObjectName = "Process"
              Instances = ["*"]
              Counters = [
                "% Processor Time",
                "Working Set",
                "Private Bytes",
                "Thread Count",
                "Handle Count",
                "IO Read Bytes/sec",
                "IO Write Bytes/sec"
              ]
              Measurement = "win_process"

          [[inputs.win_services]]
            service_names = ["*"]
      register: telegraf_conf

    - name: Configure Telegraf service recovery and auto-start
      win_shell: sc.exe failure telegraf reset= 86400 actions= restart/5000
      args:
        executable: cmd
      register: telegraf_recovery
      ignore_errors: true

    - name: Start Telegraf with auto-start
      win_service:
        name: telegraf
        state: started
        start_mode: auto

    - name: Verify Telegraf service status
      win_service:
        name: telegraf
      register: telegraf_status

    - name: Show Telegraf status
      debug:
        msg:
          - "Telegraf service: {{ telegraf_status.state }}"
          - "Config written: {{ telegraf_conf.changed | default(false) }}"
          - "Config path: {{ telegraf_conf_dest }}"
          - "PowerShell installed: {{ ps_install.rc | default('n/a') }}"
          - "Power recovery configured: {{ power_recovery.changed | default(false) }}"
