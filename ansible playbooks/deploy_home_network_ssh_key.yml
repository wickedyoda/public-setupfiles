---
# Deploy Home network SSH key to Linux hosts, routers, and macOS
- name: Deploy Home network SSH key to Linux hosts
  hosts: linux_servers
  gather_facts: false
  vars:
    home_network_key_pub: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG2wGZTOpvh0s5KmwOxPVaGHCs5NXmVh2X2djrFY9SXJ Home network"
  tasks:
    - name: Ensure .ssh directory exists
      file:
        path: "~/.ssh"
        state: directory
        mode: '0700'
    
    - name: Add Home network key to authorized_keys (root)
      become: true
      authorized_key:
        user: root
        key: "{{ home_network_key_pub }}"
        state: present
        exclusive: false

- name: Deploy Home network key to Flint4 router (no Python)
  hosts: flint4
  gather_facts: false
  vars:
    home_network_key_pub: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG2wGZTOpvh0s5KmwOxPVaGHCs5NXmVh2X2djrFY9SXJ Home network"
  tasks:
    - name: Add Home network key via shell
      shell: |
        mkdir -p ~/.ssh /etc/dropbear/authorized_keys
        echo '{{ home_network_key_pub }}' >> ~/.ssh/authorized_keys
        echo '{{ home_network_key_pub }}' >> /etc/dropbear/authorized_keys/authorized_keys
      args:
        creates: ~/.ssh/authorized_keys

- name: Deploy Home network key to macOS travers-mac-mini
  hosts: travers-mac-mini
  gather_facts: false
  vars:
    home_network_key_pub: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG2wGZTOpvh0s5KmwOxPVaGHCs5NXmVh2X2djrFY9SXJ Home network"
  tasks:
    - name: Ensure .ssh directory exists
      file:
        path: "~/.ssh"
        state: directory
        mode: '0700'
    
    - name: Add Home network key to authorized_keys (traver user)
      authorized_key:
        user: traver
        key: "{{ home_network_key_pub }}"
        state: present
        exclusive: false
    
    - name: Add Home network key to authorized_keys (root)
      become: true
      authorized_key:
        user: root
        key: "{{ home_network_key_pub }}"
        state: present
        exclusive: false

